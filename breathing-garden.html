<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>呼吸花园 · Breathing Garden</title>
<!-- PWA：可「添加到主屏幕」全屏离线运行。缺这几个文件时网页照常能用，只是不能安装 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3f8f5e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="呼吸花园">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --ink:#26332c; --dim:rgba(38,51,44,.66);
    /* 面板/胶囊要有足够不透明度，否则压在明亮天空上文字读不清 */
    --glass:rgba(253,254,252,.88); --glass-line:rgba(255,255,255,.92);
    --panel:rgba(255,255,255,.66);
    --accent:#3f8f5e; --accent-2:#2e7250; --accent-rgb:63,143,94;
    --bg:#4a8f4a;
  }
  body.theme-day  {--accent:#3f8f5e; --accent-2:#2e7250; --accent-rgb:63,143,94;   --bg:#3f7a42;}
  body.theme-dawn {--accent:#b3605c; --accent-2:#8c4644; --accent-rgb:179,96,92;   --bg:#5a6a52;}
  body.theme-dusk {--accent:#b85f3e; --accent-2:#8c4429; --accent-rgb:184,95,62;   --bg:#4a5a40;}
  body.theme-night{--ink:#e8eef4; --dim:rgba(232,238,244,.66);
    --glass:rgba(20,36,54,.82); --glass-line:rgba(255,255,255,.16);
    --panel:rgba(255,255,255,.12);
    --accent:#8fc4e0; --accent-2:#5f9cc4; --accent-rgb:143,196,224; --bg:#16283a;}

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink); overflow:hidden; -webkit-font-smoothing:antialiased;
    background:var(--bg); transition:background 1s ease;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;   /* 禁掉移动端下拉刷新，免得误触打断呼吸 */
  }
  /* 用 100vw/100vh 撑满（比 innerHeight 更贴近真实可视区），后备缓冲按实测盒子尺寸设。
     dvh 跟随移动端地址栏收放，不支持时自动退回上面的 vh */
  #scene{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;
    display:block;z-index:0;touch-action:none}

  .ui{position:fixed;inset:0;z-index:2;pointer-events:none;
    padding:max(16px,env(safe-area-inset-top)) 20px max(16px,env(safe-area-inset-bottom))}
  .ui > *{pointer-events:auto}

  .topbar{display:flex;align-items:center;gap:10px;max-width:620px;margin:0 auto}
  .brand{font-size:12.5px;letter-spacing:4px;color:var(--ink);opacity:.7;font-weight:600;white-space:nowrap}
  .spacer{flex:1}
  .time{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink);opacity:.85;letter-spacing:1.5px;font-weight:600}
  .pill{display:flex;align-items:center;gap:6px;background:transparent;
    border:1px solid var(--glass-line);color:var(--dim);padding:5px 11px;border-radius:99px;
    cursor:pointer;font-size:11px;letter-spacing:.5px;transition:.25s;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);white-space:nowrap}
  .pill:hover{color:var(--ink)}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.35;transition:.25s;flex:none}
  .pill.on{color:var(--accent);border-color:rgba(var(--accent-rgb),.5)}
  .pill.on .dot{opacity:1;box-shadow:0 0 7px currentColor}
  .icon-btn{background:var(--panel);border:1px solid var(--glass-line);color:var(--ink);opacity:.85;
    width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1;
    display:grid;place-items:center;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    transition:.25s;flex:none}
  .icon-btn:hover{opacity:1;transform:translateY(-1px)}
  .icon-btn.on{border-color:rgba(var(--accent-rgb),.55);color:var(--accent);opacity:1}

  .progress{height:3px;background:rgba(255,255,255,.4);border-radius:99px;
    margin:14px auto 0;max-width:620px;overflow:hidden}
  #progressBar{height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--accent-2),var(--accent));
    transition:width .3s linear}

  /* 倒计时由 canvas 直接画在呼吸口正中（DOM 定位永远对不齐会动的圆心） */
  .readout{position:absolute;inset:0;pointer-events:none}
  .phase{position:absolute;left:0;right:0;top:27.5%;text-align:center;
    font-size:14px;font-weight:600;letter-spacing:9px;color:var(--ink);opacity:.8;
    transition:opacity .4s;text-indent:9px;text-shadow:0 1px 14px rgba(255,255,255,.55)}
  body.theme-night .phase{text-shadow:0 1px 14px rgba(0,0,0,.55)}
  .phase.fade{opacity:0}
  .hint{position:absolute;left:0;right:0;top:64%;text-align:center;
    font-size:12px;color:var(--dim);padding:0 24px;line-height:1.75;letter-spacing:.3px}

  .summary{position:absolute;left:50%;top:24%;transform:translate(-50%,0) scale(.96);
    background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border:1px solid var(--glass-line);border-radius:20px;padding:18px 28px;
    box-shadow:0 18px 44px rgba(20,40,30,.16);
    opacity:0;pointer-events:none;transition:opacity .5s ease, transform .5s ease}
  .summary.show{opacity:1;transform:translate(-50%,0) scale(1)}
  .sum-row{display:flex;align-items:baseline;gap:18px;justify-content:space-between;padding:3px 0}
  .sum-k{font-size:11.5px;color:var(--dim);letter-spacing:1.5px}
  .sum-v{font-size:19px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}

  .panel{position:fixed;top:60px;right:20px;width:224px;z-index:8;
    background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border:1px solid var(--glass-line);border-radius:18px;padding:4px 16px;
    box-shadow:0 14px 36px rgba(20,40,30,.16);
    opacity:0;transform:translateY(-10px) scale(.97);pointer-events:none;transition:.24s}
  .panel.open{opacity:1;transform:none;pointer-events:auto}
  .panel-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
  .panel-row:first-child{border-top:none}
  .panel-row + .panel-row, .panel-row + .panel-section, .panel-section + .panel-row{
    border-top:1px solid var(--glass-line)}
  .panel-row .label{font-size:12.5px;color:var(--ink);letter-spacing:1px}
  .switch{position:relative;display:inline-block;width:42px;height:25px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .switch .track{position:absolute;inset:0;border-radius:99px;background:rgba(120,140,128,.32);
    transition:.25s;cursor:pointer}
  .switch .thumb{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
    background:#fff;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.22)}
  .switch input:checked + .track{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
  .switch input:checked + .track .thumb{transform:translateX(17px)}
  .panel-section{padding:12px 0}
  .panel-section .label{display:block;font-size:12.5px;color:var(--ink);letter-spacing:1px;margin-bottom:10px}
  .swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%}
  .sw{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;
    cursor:pointer;padding:7px 2px 6px;border-radius:12px;transition:.2s}
  .sw:hover{background:rgba(255,255,255,.3)}
  .sw i{width:21px;height:21px;border-radius:50%;display:block;
    box-shadow:inset 0 1px 2px rgba(255,255,255,.6), 0 1px 4px rgba(0,0,0,.16);transition:.25s}
  .sw span{font-size:10.5px;color:var(--dim);white-space:nowrap;letter-spacing:.5px}
  .sw.on{background:rgba(255,255,255,.3)}
  .sw.on i{box-shadow:0 0 0 2px var(--accent), 0 0 12px rgba(var(--accent-rgb),.55)}
  .sw.on span{color:var(--ink);font-weight:600}
  .sw[data-theme=day] i{background:linear-gradient(160deg,#9fd0ea,#4f9a48)}
  .sw[data-theme=dawn] i{background:linear-gradient(160deg,#f3d3b0,#c98a9a)}
  .sw[data-theme=dusk] i{background:linear-gradient(160deg,#f0a868,#b85a48)}
  .sw[data-theme=night] i{background:linear-gradient(160deg,#3a4e72,#101c30)}

  /* 底部控制：悬浮层 + 与主视觉留出呼吸感 */
  .controls{position:fixed;left:0;right:0;bottom:0;z-index:7;
    padding:0 18px max(16px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
  .controls > *{pointer-events:auto}
  /* 底部面板做「轻」：低不透明度 + 细边框，不要一大块实心白卡片 */
  .ctl-panel{width:100%;max-width:360px;background:var(--glass);
    backdrop-filter:blur(26px) saturate(1.2);-webkit-backdrop-filter:blur(26px) saturate(1.2);
    border:1px solid var(--glass-line);border-radius:22px;
    box-shadow:0 8px 26px rgba(20,40,30,.10);
    overflow:hidden;max-height:0;opacity:0;padding:0 16px;
    transition:max-height .4s cubic-bezier(.4,0,.2,1), opacity .3s, padding .4s}
  .ctl-panel.open{max-height:150px;opacity:1;padding:13px 16px}
  .lbl{font-size:9.5px;letter-spacing:2.5px;color:var(--dim);margin-bottom:6px;text-align:center;opacity:.8}
  .row{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
  .lbl + .row{margin-bottom:11px}
  .chip{background:transparent;border:1px solid transparent;color:var(--dim);
    padding:5px 11px;border-radius:99px;cursor:pointer;font-size:12px;transition:.2s;letter-spacing:.3px}
  .chip:hover{color:var(--ink);background:rgba(255,255,255,.35)}
  .chip.on{background:rgba(var(--accent-rgb),.20);color:var(--accent-2);
    border-color:rgba(var(--accent-rgb),.45);font-weight:600}

  .ctl-bar{display:flex;align-items:center;gap:10px;width:100%;max-width:360px;justify-content:center}
  .btn{flex:1;max-width:200px;padding:13px;border:none;border-radius:99px;
    font-size:14px;font-weight:700;letter-spacing:3px;cursor:pointer;transition:.28s;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
    box-shadow:0 6px 20px rgba(var(--accent-rgb),.34)}
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(var(--accent-rgb),.46)}
  .btn:active{transform:translateY(0)}
  .btn.paused{background:rgba(255,255,255,.6);color:var(--ink);box-shadow:none}
  #stopBtn{display:none}
  #stopBtn.show{display:grid}

  /* ── 矮屏（手机横屏）：纵向只有 ~390px，面板必须压扁，呼吸口上移 ── */
  @media (max-height:520px){
    .ui{padding-top:max(10px,env(safe-area-inset-top))}
    .hint{display:none}                 /* 横屏没有多余纵向空间给提示语 */
    .phase{top:15%;font-size:12.5px;letter-spacing:5px;text-indent:5px}
    .progress{margin-top:9px}
    .summary{top:12%}
    .ctl-panel.open{max-height:150px;padding:11px 14px}
    .lbl{font-size:9.5px;letter-spacing:2px;margin-bottom:5px}
    .lbl + .row{margin-bottom:9px}
    .chip{padding:6px 10px;font-size:11.5px;min-height:30px}
    .btn{padding:12px;font-size:13.5px;letter-spacing:2px}
    .icon-btn{width:30px;height:30px;font-size:12px}
    .pill{padding:4px 8px;font-size:10.5px;min-height:28px}
    .controls{gap:7px}
  }

  /* ── 窄屏 / 手机：顶栏元素总和会超出 390px，必须整体收窄 ── */
  @media (max-width:560px){
    .ui{padding-left:14px;padding-right:14px}
    .topbar{gap:7px}
    .brand{font-size:11px;letter-spacing:1px}
    .time{font-size:11.5px;letter-spacing:1px}
    .pill{padding:5px 8px;font-size:10.5px;gap:4px}
    .pill .dot{width:5px;height:5px}
    .icon-btn{width:32px;height:32px;font-size:13px}
    .hint{font-size:11.5px;padding:0 18px;letter-spacing:0}
    .phase{font-size:13px;letter-spacing:6px;text-indent:6px}
    .panel{width:calc(100vw - 28px);right:14px}
    .chip{padding:8px 12px;font-size:12px}
    .btn{padding:15px;font-size:14px;letter-spacing:2px}
    .ctl-panel{max-width:min(400px,100%)}
    .summary{padding:16px 22px}
    /* 触摸热区不小于 44px */
    .pill,.icon-btn,.chip{min-height:32px}
    .chip{min-height:34px}
  }

</style>
</head>
<body class="theme-day">

<canvas id="scene"></canvas>

<div class="ui">
  <header class="topbar">
    <div class="brand">呼 吸 花 园</div>
    <div class="spacer"></div>
    <div class="time" id="time">03:00</div>
    <button class="pill" id="sound"><span class="dot"></span>提示音</button>
    <button class="pill" id="ambient"><span class="dot"></span>环境音</button>
    <button class="icon-btn" id="gear" title="设置">⚙</button>
  </header>

  <div class="progress"><div id="progressBar"></div></div>

  <div class="readout">
    <div class="phase" id="phase">准备</div>
    <p class="hint" id="hint">找一个舒服的姿势，放松肩膀，准备好后点击「开始」</p>
  </div>

  <div class="summary" id="summary">
    <div class="sum-row"><span class="sum-k">呼吸次数</span><span class="sum-v" id="sumBreaths">0</span></div>
    <div class="sum-row"><span class="sum-k">总时长</span><span class="sum-v" id="sumTime">00:00</span></div>
  </div>
</div>

<div class="panel" id="panel">
  <div class="panel-section">
    <span class="label">天光</span>
    <div class="swatches" id="swatches"></div>
  </div>
</div>

<footer class="controls">
  <div class="ctl-panel open" id="ctlPanel">
    <div class="lbl">呼吸节奏</div>
    <div class="row" id="patterns"></div>
    <div class="lbl">时长</div>
    <div class="row" id="durations"></div>
  </div>
  <div class="ctl-bar">
    <button class="icon-btn" id="ctlToggle" title="展开 / 收起">☰</button>
    <button class="btn" id="btn">开 始</button>
    <button class="icon-btn" id="stopBtn" title="结束">⏹</button>
  </div>
</footer>

var HORIZON = {day:0.650, dawn:0.680, dusk:0.615, night:0.650};
var SPRITE_MAP = {
  star: ['flower-star-pink-sprite.png', 'flower-star-yellow-sprite.png'],
  bell: ['flower-bell-violet-sprite.png', 'flower-bell-coral-sprite.png'],
  reed: ['flower-reed-blue-sprite.png', 'flower-reed-magenta-sprite.png'],
};
var BG_IMG = {};     /* theme  -> Image */
var SPRITE = {};     /* 文件名 -> Image */
var spriteCursor = 0;

/* 素材一律走内嵌数据；若某个键缺失才回退到同名本地文件 */
function assetSrc(name){ return ASSET_DATA[name] || name; }

function loadAssets(){
  THEME_LIST.forEach(function(t){
    var im = new Image();
    im.onload = function(){ BG_IMG[t] = im; if(t === S.theme) buildBackground(); };
    im.src = assetSrc('bg-' + t + '.png');
  });
  Object.keys(SPRITE_MAP).forEach(function(v){
    SPRITE_MAP[v].forEach(function(fn){
      var im = new Image();
      im.onload = function(){ SPRITE[fn] = im; };
      im.src = assetSrc(fn);
    });
  });
}
function pickSprite(variant){
  var arr = SPRITE_MAP[variant] || SPRITE_MAP.star;
  spriteCursor = (spriteCursor + 1 + Math.floor(Math.random() * arr.length)) % arr.length;
  return arr[spriteCursor];
}
function spriteOf(f){
  if(!f.sprite) return null;
  return SPRITE[f.sprite] || null;
}

var MAX_FLOWERS = 80, POOL_SIZE = 420, SPROUT_DUR = 1.25;

/* 按天光预先把精灵压暗，避免每帧对上百个精灵套 ctx.filter */
var SPRITE_CACHE = {};
function spriteFor(f, T){
  var img = SPRITE[f.sprite];
  if(!img) return null;
  if(T.light >= 0.995) return img;
  var key = S.theme + '|' + f.sprite;
  var c = SPRITE_CACHE[key];
  if(!c){
    c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    var x = c.getContext('2d');
    x.filter = 'brightness(' + T.light.toFixed(3) + ') saturate(' +
               (0.55 + T.light * 0.45).toFixed(3) + ')';
    x.drawImage(img, 0, 0);
    SPRITE_CACHE[key] = c;
  }
  return c;
}

/* ══════════════════════════════════════════════════════════
   2. 状态
   ══════════════════════════════════════════════════════════ */
var S = {
  pattern:'box', durVal:180, theme:'day', countText:'4',
  soundOn:false, ambientOn:false,
  running:false, paused:false,
  idx:0, phaseElapsed:0, sessionElapsed:0, sessionTotal:0,
  /* 会话时钟原点（performance.now 毫秒）。息屏时 rAF 会停，
     但 performance.now 照走；回到前台按它一次追平即可。 */
  clockBase:0,
  breathCount:0,
  quality:3, time:0, gust:0,
};
var flowers = [], sprouts = [];
/* 呼吸口颜色固定不变 —— 每轮换色会让人分神，它只是呼吸的标尺 */
var central = {bloom:0.85, spread:0.5, glow:0.85, tilt:0.05,
               phase:1.7, color:FLOWER_PALETTE[0], spin:1};
var lastColorIdx = 0;

/* ══════════════════════════════════════════════════════════
   3. 工具
   ══════════════════════════════════════════════════════════ */
function rgba(c,a){ return 'rgba('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+','+a+')'; }
function lerp(a,b,t){ return a+(b-a)*t; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function smooth(t){ return t*t*(3-2*t); }
function rand(a,b){ return a+Math.random()*(b-a); }
function fmt(s){
  if(s==null||isNaN(s)) return '--:--';
  s=Math.max(0,Math.floor(s));
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function shade(c,k){ return [c[0]*k, c[1]*k, c[2]*k]; }
function mix(a,b,t){ return [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)]; }
function curTheme(){ return THEMES[S.theme] || THEMES.day; }
function nextColor(){
  var i;
  do { i = Math.floor(Math.random()*FLOWER_PALETTE.length); }
  while (i===lastColorIdx && FLOWER_PALETTE.length>1);
  lastColorIdx=i;
  return FLOWER_PALETTE[i];
}

/* ══════════════════════════════════════════════════════════
   4. 画布与布局
   ══════════════════════════════════════════════════════════ */
var canvas = document.getElementById('scene');
var ctx = canvas.getContext('2d');
var bg = document.createElement('canvas');
var bgx = bg.getContext('2d');

var W=0,H=0,DPR=1;
var bandTop=0, bandH=0;
var BASE_LO=0.34, BASE_HI=0.82;

function layout(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  /* 直接量 canvas 的 CSS 盒子：innerHeight 在部分环境下小于可视高，会露一条 body 底色 */
  var r = canvas.getBoundingClientRect();
  W = Math.round(r.width) || window.innerWidth;
  H = Math.round(r.height) || window.innerHeight;
  canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  bg.width = Math.round(W*DPR); bg.height = Math.round(H*DPR);
  bgx.setTransform(DPR,0,0,DPR,0,0);
  bandTop = H*(HORIZON[S.theme] || 0.65);  /* 按生图实测地平线对齐 */
  bandH = H - bandTop;
  /* 上限随屏宽走：手机草甸窄，塞 80 朵会糊成一片 */
  MAX_FLOWERS = clamp(Math.round(W/14), 24, 80);
  buildBackground();
}
function flowerX(nx){ return nx*W; }
function flowerBaseY(n){ return bandTop + bandH*(BASE_LO + n*(BASE_HI-BASE_LO)); }

/* 中央「呼吸口」——像花，但它没有茎、悬在画面正中，只随呼吸开合。
   刻意不跟地上的花用同一套精灵：那会让人以为它也是一株植物。 */
function orbGeom(){
  var r = Math.min(W*0.26, H*0.115);   /* 手机竖屏靠宽度取值，呼吸口才够大 */
  var x = W*0.5;
  /* 矮屏（横屏）往上挪，给底部控制面板让出空间 */
  var y = H*(H < 520 ? 0.335 : 0.475)
        + Math.sin(S.time*0.45 + central.phase)*H*0.004
        + S.gust*Math.sin(S.time*1.9)*H*0.010;
  var petal = r * (0.62 + 0.62*central.bloom);      /* 花瓣伸展半径 */
  return {x:x, y:y, r:r, petal:petal, core: petal*0.50, glow: central.glow};
}

/* ══════════════════════════════════════════════════════════
   5. 场景资源（天空 / 云 / 远山 / 草）
   ══════════════════════════════════════════════════════════ */
var stars=[], clouds=[], blades=[];

/* 平滑山脊：多个正弦叠加，避免规则波形。profile 落在 [0.15,0.95] */
function ridge(seedP, amp, base){
  var pts=[], step=Math.max(10, W/64);
  for(var x=-step; x<=W+step; x+=step){
    var t=x/W;
    var p = 0.55 + 0.22*Math.sin(t*4.1+seedP)
                 + 0.11*Math.sin(t*9.7+seedP*2.2)
                 + 0.07*Math.sin(t*21.3+seedP*3.7);
    pts.push({x:x, y: base - amp*clamp(p,0.15,0.95)});
  }
  return pts;
}
/* 四层山：山顶高度递减 + 越远越淡（大气透视） */
var HILL_LAYERS = [
  {hmin:0.10, hmax:0.44, mixSky:0.62, alpha:0.40},
  {hmin:0.075,hmax:0.33, mixSky:0.44, alpha:0.52},
  {hmin:0.055,hmax:0.23, mixSky:0.26, alpha:0.66},
  {hmin:0.035,hmax:0.14, mixSky:0.08, alpha:0.80},
];
function buildAssets(){
  stars.length=0;
  var n = Math.round(W*H/17000);
  for(var i=0;i<n;i++){
    stars.push({x:Math.random()*W, y:Math.random()*bandTop*0.9,
                r:rand(0.4,1.15), a:rand(0.15,0.75)});
  }
  /* 云：数枚椭圆聚合成团 */
  clouds.length=0;
  var cn = Math.max(3, Math.round(W/460));
  for(var c=0;c<cn;c++){
    var puffs=[], pn=Math.round(rand(3,5)), cx=rand(0.05,0.95)*W, cy=rand(0.06,0.34)*bandTop;
    var base=rand(0.05,0.10)*H;
    for(var p=0;p<pn;p++){
      puffs.push({dx:rand(-1.5,1.5)*base, dy:rand(-0.35,0.35)*base, r:rand(0.55,1.15)*base});
    }
    clouds.push({x:cx, y:cy, puffs:puffs, scale:rand(0.7,1.25), drift:rand(0.4,1.0)});
  }
  /* 草：成簇，填充叶形（比描边线耐看） */
  blades.length=0;
  /* 抖动网格而非纯随机：纯随机会结块，形成难看的「斑点感」 */
  var cols = Math.max(14, Math.round(W/56)), rows = 6;
  for(var cx2=0; cx2<cols; cx2++){
    for(var ry=0; ry<rows; ry++){
      var gx = clamp((cx2 + rand(-0.42,0.42))/cols, 0, 1);
      var gy = clamp((ry + rand(-0.42,0.42))/rows, 0, 1);
      var depth = gy;                       /* 越靠下越近 */
      var cnt = 2 + Math.floor(Math.random()*3);
      for(var k=0;k<cnt;k++){
        blades.push({
          nx: clamp(gx + rand(-0.008,0.008), 0, 1), ny: gy, depth: depth,
          h: rand(0.045,0.115) * (0.60+depth*0.80),
          w: rand(0.0016,0.0040) * (0.7+depth*0.8),
          lean: rand(-0.85,0.85),
          phase: Math.random()*6.283,
          front: depth>0.86
        });
      }
    }
  }
  buildBackground();
}

function drawCover(c, img, w, h){
  var ia = img.width/img.height, sa = w/h, dw, dh, dx, dy;
  if(ia > sa){ dh = h; dw = h*ia; dx = (w-dw)/2; dy = 0; }
  else { dw = w; dh = w/ia; dx = 0; dy = (h-dh)/2; }
  c.clearRect(0, 0, w, h);
  c.drawImage(img, dx, dy, dw, dh);
}
function buildBackground(){
  var img = BG_IMG[S.theme];
  if(img){ drawCover(bgx, img, W, H); return; }   /* 生图背景优先 */
  buildProceduralBg();                            /* 无素材时回退到手绘 */
}
function buildProceduralBg(){
  var T=curTheme();
  /* 天空 */
  var g = bgx.createLinearGradient(0,0,0,bandTop);
  g.addColorStop(0,    rgba(T.sky[0],1));
  g.addColorStop(0.52, rgba(T.sky[1],1));
  g.addColorStop(1,    rgba(T.sky[2],1));
  bgx.fillStyle=g; bgx.fillRect(0,0,W,bandTop);

  /* 天光（太阳/月亮的光晕，贴着地平线） */
  var sx = W*0.68, sy = bandTop*0.86, sr = Math.max(W,H)*0.55;
  var sg = bgx.createRadialGradient(sx,sy,0,sx,sy,sr);
  sg.addColorStop(0,   rgba(T.sun, T.sunA));
  sg.addColorStop(0.35,rgba(T.sun, T.sunA*0.35));
  sg.addColorStop(1,   rgba(T.sun, 0));
  bgx.fillStyle=sg; bgx.fillRect(0,0,W,bandTop);

  /* 星点 */
  if(T.starA>0.01){
    for(var s=0;s<stars.length;s++){
      var st=stars[s];
      bgx.beginPath(); bgx.arc(st.x,st.y,st.r,0,6.283);
      bgx.fillStyle='rgba(255,255,255,'+(st.a*T.starA).toFixed(3)+')'; bgx.fill();
    }
  }

  /* 云：复合路径一次填充（逐椭圆填充会在重叠处叠深成硬边）+ 整体柔化 */
  var cloudCol = mix(T.cloud, T.sky[2], 0.18);
  bgx.save();
  bgx.filter = 'blur(' + Math.round(Math.max(5, H*0.011)) + 'px)';
  bgx.fillStyle = rgba(cloudCol, T.cloudA);
  for(var c=0;c<clouds.length;c++){
    var cl=clouds[c];
    bgx.beginPath();
    for(var p=0;p<cl.puffs.length;p++){
      var pf=cl.puffs[p];
      var ex=cl.x+pf.dx*cl.scale, ey=cl.y+pf.dy*cl.scale, er=pf.r*cl.scale;
      bgx.moveTo(ex+er, ey);
      bgx.ellipse(ex, ey, er, er*0.66, 0, 0, 6.283);
    }
    bgx.fill();
  }
  bgx.restore();

  /* 远山 */
  for(var L=0; L<HILL_LAYERS.length; L++){
    var hl = HILL_LAYERS[L];
    var hmin = hl.hmin*bandH, hmax = hl.hmax*bandH;
    var amp  = (hmax-hmin)/0.6;
    var base = bandTop - hmin + 0.25*amp;
    var pts  = ridge(L*1.7+0.6, amp, base);
    bgx.beginPath();
    bgx.moveTo(pts[0].x, bandTop+bandH);
    for(var q=0;q<pts.length;q++) bgx.lineTo(pts[q].x, pts[q].y);
    bgx.lineTo(pts[pts.length-1].x, bandTop+bandH);
    bgx.closePath();
    bgx.fillStyle = rgba(mix(T.hills[L], T.sky[2], hl.mixSky), hl.alpha);
    bgx.fill();
  }

  /* 草地：远亮近深做纵深；顶边加轻微起伏，避免一条死板的水平线 */
  var gg = bgx.createLinearGradient(0,bandTop-2,0,H);
  gg.addColorStop(0,   rgba(T.grassFar,1));
  gg.addColorStop(0.30,rgba(mix(T.grassFar,T.grassNear,0.45),1));
  gg.addColorStop(1,   rgba(T.grassNear,1));
  bgx.beginPath();
  bgx.moveTo(0, H);
  var hstep = Math.max(12, W/56);
  for(var hx=0; hx<=W+hstep; hx+=hstep){
    var ht = hx/W;
    bgx.lineTo(hx, bandTop + 6*Math.sin(ht*3.1+1.2) + 3.5*Math.sin(ht*7.7+0.4));
  }
  bgx.lineTo(W, H);
  bgx.closePath();
  bgx.fillStyle=gg; bgx.fill();

  /* 地平线柔光：消掉天空与草地之间的硬边 */
  var hg = bgx.createLinearGradient(0,bandTop-26,0,bandTop+16);
  hg.addColorStop(0,   rgba(T.sky[2],0));
  hg.addColorStop(0.55,rgba(mix(T.sky[2],T.grassFar,0.5),0.30));
  hg.addColorStop(1,   rgba(T.grassFar,0));
  bgx.fillStyle=hg; bgx.fillRect(0,bandTop-26,W,42);
}

/* ══════════════════════════════════════════════════════════
   6. 粒子池
   ══════════════════════════════════════════════════════════ */
var fx=[], fxCursor=0;
for(var i=0;i<POOL_SIZE;i++){
  fx.push({on:false,x:0,y:0,vx:0,vy:0,g:0,r:1,life:0,max:1,a:1,c:[255,255,255],sway:0,sw:0,drag:0});
}
function emit(x,y,opt){
  for(var k=0;k<POOL_SIZE;k++){
    fxCursor=(fxCursor+1)%POOL_SIZE;
    var p=fx[fxCursor];
    if(p.on) continue;
    p.on=true; p.x=x; p.y=y;
    p.vx=opt.vx||0; p.vy=opt.vy||0; p.g=opt.g||0; p.r=opt.r||1.6;
    p.max=p.life=opt.life||1.6; p.a=opt.a==null?0.8:opt.a; p.c=opt.c||[255,255,255];
    p.sway=Math.random()*6.283; p.sw=opt.sw||0; p.drag=opt.drag||0;
    return p;
  }
  return null;
}
function updateFx(dt){
  for(var i=0;i<POOL_SIZE;i++){
    var p=fx[i]; if(!p.on) continue;
    p.life-=dt; if(p.life<=0){ p.on=false; continue; }
    p.vy += p.g*dt;
    if(p.drag){ p.vx*=(1-p.drag*dt); p.vy*=(1-p.drag*dt); }
    if(p.sw){ p.sway+=p.sw*dt; p.x += Math.sin(p.sway)*10*dt; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.y>H+40||p.y<-60||p.x<-60||p.x>W+60) p.on=false;
  }
}
function drawFx(){
  for(var i=0;i<POOL_SIZE;i++){
    var p=fx[i]; if(!p.on) continue;
    var t=p.life/p.max;
    var a=p.a*(t>0.75?(1-t)*4:t/0.75);
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(0.5+t*0.5),0,6.283);
    ctx.fillStyle=rgba(p.c, clamp(a,0,1)); ctx.fill();
  }
}
var motes=[];
function buildMotes(){
  motes.length=0;
  var n=Math.round(W*H/26000);
  for(var i=0;i<n;i++){
    motes.push({x:Math.random()*W, y:Math.random()*H, r:rand(0.5,1.6),
                s:rand(4,15), a:rand(0.08,0.34), sway:Math.random()*6.283, sw:rand(0.3,1.0)});
  }
}
function drawMotes(dt,T){
  var cap = S.quality>=3 ? motes.length : Math.round(motes.length*(0.35+S.quality*0.2));
  var col = T.starA>0.5 ? [255,255,255] : [255,252,232];
  for(var i=0;i<cap;i++){
    var m=motes[i];
    m.y -= m.s*dt; m.sway += m.sw*dt; m.x += Math.sin(m.sway)*6*dt;
    if(m.y<-8){ m.y=H+8; m.x=Math.random()*W; }
    if(m.x<-10) m.x=W+10; if(m.x>W+10) m.x=-10;
    ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,6.283);
    var tw=0.65+0.35*Math.sin(S.time*1.6+i);
    ctx.fillStyle=rgba(col, m.a*tw*0.85); ctx.fill();
  }
}

/* ══════════════════════════════════════════════════════════
   7. 花
   ══════════════════════════════════════════════════════════ */
/* 饱满花瓣：中段鼓起、尖端收拢 */
/* 二次贝塞尔取点，用于锥度茎 */
function qbez(p0,p1,p2,t){ var mt=1-t; return mt*mt*p0 + 2*mt*t*p1 + t*t*p2; }

function petalPath(len,wid,bend){
  var tX=bend*len;
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo( wid*1.48, -len*0.20,  wid*1.08+tX, -len*0.66,  tX, -len);
  ctx.bezierCurveTo(-wid*1.08+tX, -len*0.66, -wid*1.48,  -len*0.20, 0,  0);
  ctx.closePath();
}

/* 用生图精灵绘制整株花（含茎叶），锚点在底部中心 → 缩放即「生长」 */
function drawSpriteFlower(f, img){
  var gr = (f.grow==null) ? 1 : smooth(clamp(f.grow,0,1));
  var h = f.plantH * gr;
  if(!(h > 0.5)) return;
  var w = h * (img.width/img.height);
  var sway = Math.sin(S.time*0.55+f.phase) * f.swayAmp * 0.05
           + S.gust * Math.sin(S.time*1.9+f.phase) * 0.07;
  var tilt = (f.tilt==null) ? 0 : f.tilt;
  ctx.save();
  ctx.globalAlpha = (f.alpha==null) ? 1 : f.alpha;
  ctx.translate(f.x, f.baseY);
  ctx.rotate(sway + tilt);
  ctx.drawImage(img, -w/2, -h, w, h);
  ctx.restore();
  f._hx = f.x; f._hy = f.baseY - h*0.80; f._r = w*0.32;
}

function drawFlower(f,T,isCentral){
  var img = spriteFor(f, T);
  if(img){ drawSpriteFlower(f, img); return; }
  var v = VARIANTS[f.variant] || VARIANTS.star;
  var gr = (f.grow==null) ? 1 : smooth(clamp(f.grow,0,1));
  var size  = f.size * f.scale * gr;
  var stemH = f.stem * f.scale * gr;

  var sway = Math.sin(S.time*0.55+f.phase) * f.swayAmp * f.scale
           + S.gust * Math.sin(S.time*1.9+f.phase) * size * 0.9;
  var tilt = (isCentral ? central.tilt : f.restTilt) * size * 0.55;

  var baseX=f.x, baseY=f.baseY;
  var topX = baseX + sway*0.55 + tilt;
  var topY = baseY - stemH;
  var ctrlX= baseX + sway*0.22, ctrlY = baseY - stemH*0.52;

  var alpha = (f.alpha==null)?1:f.alpha;
  var lit = T.light;
  var pc = f.color || FLOWER_PALETTE[0];
  var cHi  = shade(pc.hi,  lit);
  var cMid = shade(pc.mid, lit);
  var cDeep= shade(pc.deep, lit);

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.lineCap='round';

  /* 茎：沿曲线分段描边得到锥度，段间 round cap 自然衔接（两段式拼接会有折角） */
  var wBot = Math.max(1.7, size*0.075), wTop = Math.max(0.9, size*0.028);
  var segs = f.detail>=2 ? 7 : 3;
  ctx.strokeStyle = rgba(shade(T.stem, lit*0.92), 0.92);
  for(var sg=0; sg<segs; sg++){
    var t0=sg/segs, t1=(sg+1)/segs;
    ctx.beginPath();
    ctx.moveTo(qbez(baseX,ctrlX,topX,t0), qbez(baseY,ctrlY,topY,t0));
    ctx.lineTo(qbez(baseX,ctrlX,topX,t1), qbez(baseY,ctrlY,topY,t1));
    ctx.lineWidth = lerp(wBot, wTop, (t0+t1)/2);
    ctx.stroke();
  }

  /* 叶 */
  if(f.detail>=1){
    for(var lf=0; lf<2; lf++){
      var lt = lf===0?0.44:0.70;
      var lx = baseX + (topX-baseX)*lt, ly = baseY + (topY-baseY)*lt;
      var dir = lf===0?-1:1, llen = size*(f.detail>=2?0.58:0.44);
      ctx.beginPath();
      ctx.moveTo(lx,ly);
      ctx.bezierCurveTo(lx+dir*llen*0.35, ly-llen*0.16,
                        lx+dir*llen*0.75, ly-llen*0.40,
                        lx+dir*llen,      ly-llen*0.66);
      ctx.bezierCurveTo(lx+dir*llen*0.52, ly-llen*0.34,
                        lx+dir*llen*0.20, ly-llen*0.10,
                        lx, ly);
      ctx.closePath();
      ctx.fillStyle = rgba(shade(T.stem, lit*0.84), 0.72); ctx.fill();
    }
  }

  var hx = topX + sway*0.30;
  var hy = topY - size*0.20;
  var r  = size * f.bloom;

  /* 光晕 */
  var halo = f.halo * (isCentral?central.glow:1);
  if(halo>0.02){
    var hr = r*(isCentral?2.1:1.7);
    var hg = ctx.createRadialGradient(hx,hy,r*0.35,hx,hy,hr);
    hg.addColorStop(0,   rgba(cMid, 0.15*halo));
    hg.addColorStop(0.5, rgba(cDeep,0.07*halo));
    hg.addColorStop(1,   rgba(cDeep,0));
    ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(hx,hy,hr,0,6.283); ctx.fill();
  }

  var spread = isCentral ? central.spread : f.spread;
  var plen = r * lerp(0.50,1.15,clamp(spread,0,1)) * v.len;
  var pwid = r * v.wid;

  var n = f.detail>=2 ? v.petals : Math.max(4, Math.round(v.petals*0.6));
  var lightAng = -Math.PI*1.25;               /* 光来自左上 */
  for(var i=0;i<n;i++){
    var frac = n>1 ? i/n : 0;
    var ang = (v.droop>0.45) ? Math.PI*0.67 + frac*Math.PI*0.66 : frac*6.283;
    /* 沿光照方向给花瓣明暗：纯色填充会像贴纸 */
    var tone = 1 + 0.14*Math.cos(ang - lightAng);
    ctx.save();
    ctx.translate(hx,hy); ctx.rotate(ang);
    ctx.fillStyle = rgba(shade(cMid, tone*lit), 0.97);
    petalPath(plen,pwid,v.bend*1.05);
    ctx.fill();
    if(f.detail>=2){
      ctx.lineWidth = Math.max(0.4, size*0.010);
      ctx.strokeStyle = rgba(shade(cDeep,lit), 0.20);
      ctx.stroke();
    }
    ctx.restore();
  }
  /* 花心透光：让花朵从中心「亮起来」 */
  var core = ctx.createRadialGradient(hx,hy,0,hx,hy,r*1.15);
  core.addColorStop(0,   rgba(cHi, 0.62));
  core.addColorStop(0.40,rgba(cHi, 0.14));
  core.addColorStop(1,   rgba(cHi, 0));
  ctx.fillStyle=core;
  ctx.beginPath(); ctx.arc(hx,hy,r*1.15,0,6.283); ctx.fill();

  /* 花心 */
  if(v.disc>0.25 && f.detail>=1){
    var dr = r*(0.13+0.11*v.disc);
    var dg = ctx.createRadialGradient(hx-dr*0.3, hy-dr*0.3, 0, hx, hy, dr);
    dg.addColorStop(0, rgba(cHi,0.98));
    dg.addColorStop(0.7, rgba(shade(pc.deep,lit*1.25),0.92));
    dg.addColorStop(1, rgba(cDeep,0.85));
    ctx.fillStyle=dg; ctx.beginPath(); ctx.arc(hx,hy,dr,0,6.283); ctx.fill();
  }
  ctx.restore();
  f._hx=hx; f._hy=hy; f._r=r;
}

/* ══════════════════════════════════════════════════════════
   8. 数量档位
   ══════════════════════════════════════════════════════════ */
function tierOf(n){
  /* 花一律做小：小小一朵插在草地里才自然。
     不再按数量放大 —— 那样每加一朵，已有的花都会跟着变一次大小。
     数量只决定「密集模式」的细节取舍（前后景分层、去掉光晕、简化绘制）。 */
  var dense = n > 8;
  return {key: dense?'dense':'sparse', plant:0.30, stem:0.58,
          halo: dense?0:0.5, detail: dense?0:2, scale:1, back: dense};
}
function flowerSize(f){ return bandH*0.20*f.jitter; }
function syncTier(dt){
  var t=tierOf(flowers.length), k=1-Math.exp(-dt*4);
  for(var i=0;i<flowers.length;i++){
    var f=flowers[i];
    f.plantH= lerp(f.plantH, bandH*t.plant*f.jitter, k);
    f.halo  = lerp(f.halo,  t.halo, k);
    f.detail= t.detail;
    f.alpha = lerp(f.alpha, t.key==='dense' ? (f.back?0.66:0.96) : 1, k);
    /* 手绘回退参数 */
    f.stem  = lerp(f.stem,  t.stem, k);
    f.scale = lerp(f.scale, t.scale*f.jitter, k);
    f.size  = flowerSize(f);
    f.baseY = flowerBaseY(f.nBase);
  }
}
function assignLayers(){
  var dense = flowers.length>8;
  for(var i=0;i<flowers.length;i++){
    var f=flowers[i];
    if(dense){ if(!f._layered){ f.back = Math.random()<0.62; f._layered=true; } }
    else { f.back=false; f._layered=false; }
  }
}

/* ══════════════════════════════════════════════════════════
   9. 落花
   ══════════════════════════════════════════════════════════ */
function bestSpot(){
  var minGap = flowers.length<=3 ? 0.22 : (flowers.length<=8 ? 0.12 : 0.035);
  var best=null, bestScore=-1;
  for(var t=0;t<40;t++){
    var nx=rand(0.07,0.93), score=1e9;
    for(var i=0;i<flowers.length;i++){
      var d=Math.abs(flowers[i].nx-nx);
      if(d<score) score=d;
    }
    if(flowers.length===0) score=9;
    if(score>=minGap) return {nx:nx};
    if(score>bestScore){ bestScore=score; best={nx:nx}; }
  }
  return best;
}
/* 在草地上随机一处「种下」——花苗从土里长出来，而不是有东西飞过去 */
function sprout(){
  var spot = bestSpot();
  var sp = {
    t:0, dur:SPROUT_DUR,
    nx: spot.nx, nBase: rand(0.34,1.0), jitter: rand(0.86,1.14),
    variant: VARIANT_OF[S.pattern],
    sprite: pickSprite(VARIANT_OF[S.pattern]),
    color: nextColor(),
    phase: Math.random()*6.283,
    tilt: rand(-0.05,0.05),
    dusted: false
  };
  sp.x = flowerX(sp.nx); sp.baseY = flowerBaseY(sp.nBase);
  sprouts.push(sp);
  emitDust(sp.x, sp.baseY);
}
function updateSprouts(dt){
  for(var i=sprouts.length-1;i>=0;i--){
    var sp=sprouts[i];
    sp.t += dt;
    if(sp.t >= sp.dur){
      flowers.push({
        nx:sp.nx, nBase:sp.nBase, jitter:sp.jitter,
        variant:sp.variant, sprite:sp.sprite, color:sp.color,
        phase:sp.phase, swayAmp:rand(0.5,1.3),
        restTilt:sp.tilt, spread:rand(0.72,1.0), bloom:1, grow:1,
        back:false, halo:1, detail:2, scale:1, stem:0.6, size:0, alpha:1,
        plantH: bandH * tierOf(flowers.length+1).plant * sp.jitter,
        x:sp.x, baseY:sp.baseY
      });
      if(flowers.length>MAX_FLOWERS) flowers.shift();
      assignLayers();
      sprouts.splice(i,1);
    }
  }
}
function drawSprouts(T){
  for(var i=0;i<sprouts.length;i++){
    var sp=sprouts[i];
    var e = clamp(sp.t/sp.dur, 0, 1);
    /* 出土：前 80% 平滑抽出，末尾轻微回弹，像植物抽条 */
    var k = e<0.8 ? smooth(e/0.8) : 1 + 0.07*Math.sin((e-0.8)/0.2*Math.PI);
    var target = bandH * tierOf(flowers.length+1).plant * sp.jitter;
    var h = target * k;
    drawFlower({
      x:sp.x, baseY:sp.baseY, plantH:h, sprite:sp.sprite,
      variant:sp.variant, color:sp.color, grow:1,
      swayAmp:1.1, phase:sp.phase, tilt:sp.tilt, alpha:Math.min(1,k*1.6),
      halo:0.8, detail:2, spread:0.8,
      /* 手绘回退 */
      size:h*0.30, scale:1, stem:h*0.70, restTilt:0
    }, T, false);
  }
}

/* ══════════════════════════════════════════════════════════
   10. 呼吸引擎
   ══════════════════════════════════════════════════════════ */
function phases(){ return PATTERNS[S.pattern].phases; }
function curPhase(){ return phases()[S.idx]; }

/* 待机时花必须可见 —— 之前每帧被拉向吸气起点 0.06，导致主角缩成一个小点 */
function applyCentral(dt){
  if(!S.running){
    var k0 = 1-Math.exp(-dt*3);
    central.bloom  = lerp(central.bloom,  0.85, k0);   /* 待机也要是完整可见的一株 */
    central.spread = lerp(central.spread, 0.50, k0);
    central.glow   = lerp(central.glow,   0.85, k0);
    central.tilt   = lerp(central.tilt,   0.05, k0);
    return;
  }
  var p = curPhase();
  var anim = PHASE_ANIM[p.type] || PHASE_ANIM.inhale;
  var prog = clamp(S.phaseElapsed / p.sec, 0, 1);
  var e = smooth(prog);
  var k = 1-Math.exp(-dt*12);

  var tb = lerp(anim.bloom[0],  anim.bloom[1],  e);
  var ts = lerp(anim.spread[0], anim.spread[1], e);
  var tg = lerp(anim.glow[0],   anim.glow[1],   e);
  var tt = lerp(anim.tilt[0],   anim.tilt[1],   e);
  if(p.type==='hold') tb += Math.sin(S.time*0.628)*0.012;   /* 0.1Hz 微脉动 */

  central.bloom  = lerp(central.bloom,  tb, k);
  central.spread = lerp(central.spread, ts, k);
  central.glow   = lerp(central.glow,   tg, k);
  central.tilt   = lerp(central.tilt,   tt, k);

  if(!S.paused){
    if(p.type==='exhale' && Math.random()<dt*14) emitExhale();
    if(p.type==='hold'   && Math.random()<dt*2.2) emitBubble();
  }
}
function emitExhale(){
  var g=orbGeom();
  var ang=Math.random()*6.283, sp=rand(26,72);
  emit(g.x+Math.cos(ang)*g.petal*0.85, g.y+Math.sin(ang)*g.petal*0.85, {
    vx:Math.cos(ang)*sp*0.55, vy:Math.sin(ang)*sp*0.35 - rand(8,26),
    g:34, r:rand(0.9,2.1), life:rand(1.6,3.0), a:0.7,
    c:central.color.mid, sw:rand(-1.2,1.2), drag:0.6
  });
}
function emitBubble(){
  var g=orbGeom();
  emit(g.x+rand(-g.petal*0.8,g.petal*0.8), g.y+rand(-g.petal*0.8,0), {
    vx:rand(-6,6), vy:rand(-22,-9), g:0, r:rand(0.8,1.8), life:rand(1.4,2.6),
    a:0.45, c:[255,255,238], sw:rand(-1.5,1.5)
  });
}
/* 破土扬尘：花苗顶出土面时的一小撮 */
function emitDust(x,y){
  for(var i=0;i<7;i++){
    emit(x+rand(-6,6), y+rand(-3,3), {
      vx:rand(-22,22), vy:rand(-34,-10), g:52, r:rand(0.8,1.7),
      life:rand(0.5,1.0), a:0.5, c:[196,186,150], drag:1.6
    });
  }
}
function emitPollenRain(){
  var srcs = flowers.slice(-14);
  for(var i=0;i<srcs.length;i++){
    var f=srcs[i];
    for(var j=0;j<3;j++){
      emit(f.x+rand(-14,14), f.baseY-rand(20,70), {
        vx:rand(-14,14), vy:rand(-70,-26), g:44, r:rand(0.9,2.0),
        life:rand(2.0,3.4), a:0.75, c:(j%2?f.color.mid:f.color.hi),
        sw:rand(-1.4,1.4), drag:0.5
      });
    }
  }
}
function onBreathComplete(){
  S.breathCount++;
  sprout();                       /* 草地上破土长出一朵 */
  central.spin = Math.random()<0.5?-1:1;
  central.bloom = 0.10; central.spread = 0.28;
  central.glow = 0.30;  central.tilt = 0.35;
}

/* 一个循环内各阶段的起点与长度。音频排程和画面追平共用这张时间表，
   两边永远不会各算各的。 */
function cycleInfo(){
  var ps=phases(), starts=[], t=0, exEnd=-1;
  for(var i=0;i<ps.length;i++){
    starts.push({t:t, type:ps[i].type});
    t+=ps[i].sec;
    if(ps[i].type==='exhale') exEnd=t;
  }
  return {starts:starts, len:t, exEnd:exEnd};
}

/* 会话时钟：以 performance.now 为准。息屏时 rAF 会停，它不会停；
   回到前台按真实时间一次追平即可，不依赖逐帧累加。 */
function sessionNow(){
  if(!S.running || S.paused) return S.sessionElapsed;
  var t=(performance.now()-S.clockBase)/1000;
  if(t<0) t=0;
  if(S.sessionTotal>0 && t>S.sessionTotal) t=S.sessionTotal;
  return t;
}

/* 直接由会话时间算阶段，而不是累加 dt：
   息屏几十秒后回来，阶段索引和阶段内进度依然精确。 */
function phaseAt(t){
  var ps=phases(), L=0, i;
  for(i=0;i<ps.length;i++) L+=ps[i].sec;
  if(!(L>0)) return {idx:0, elapsed:0};
  var x=t%L;
  for(i=0;i<ps.length;i++){
    if(x<ps[i].sec || i===ps.length-1)
      return {idx:i, elapsed:Math.min(x, ps[i].sec)};
    x-=ps[i].sec;
  }
  return {idx:0, elapsed:0};
}
/* 到时刻 t 为止完成的呼吸次数（一次呼吸 = 呼气结束） */
function breathsDone(t){
  var info=cycleInfo();
  if(!(info.len>0) || !(info.exEnd>0) || t<info.exEnd) return 0;
  return Math.floor((t-info.exEnd)/info.len)+1;
}

function syncSession(){
  if(!S.running || S.paused) return;
  var t=sessionNow();
  if(t-S.sessionElapsed < 1e-4) return;
  S.sessionElapsed=t;

  /* 息屏期间跨过的完整呼吸：次数照算，但一次最多补种 8 朵，
     免得息屏半小时后回来瞬间冒出上百朵花 */
  var target=breathsDone(t), missing=target-S.breathCount;
  if(missing>0){
    var grow=Math.min(missing,8), i;
    for(i=0;i<grow;i++) onBreathComplete();
    S.breathCount += missing-grow;
  }

  var pa=phaseAt(t), changed=(pa.idx!==S.idx);
  S.idx=pa.idx; S.phaseElapsed=pa.elapsed;
  var p=phases()[S.idx];
  S.countText=String(Math.max(0, Math.ceil(p.sec-S.phaseElapsed)));
  if(changed) setPhaseUI(true);

  if(S.sessionTotal>0){
    var remain=S.sessionTotal-S.sessionElapsed;
    progressBar.style.width=(100*clamp(S.sessionElapsed/S.sessionTotal,0,1)).toFixed(1)+'%';
    timeEl.textContent = remain>0?fmt(remain):'00:00';
    if(remain<=0) finish(true);
  }else if(S.running && S.soundOn && sched.active && S.sessionElapsed > sched.horizon-60){
    /* 自由模式：排程快到期时（只可能在前台发生）再续一小时 */
    scheduleSessionAudio(S.sessionElapsed);
  }
}

/* ══════════════════════════════════════════════════════════
   11. 音频

   提示音不能靠 setTimeout / rAF 触发：息屏后 WebView 停止渲染帧、
   定时器也会被系统降频，但 Web Audio 的音频线程仍在跑（环境风声
   就是证据）。所以这里把整段会话的提示音一次性排到 AudioContext
   的时间轴上（start(when)），息屏后照常响；画面等回到前台再按真实
   时间追平。

   四个阶段四种音色，闭着眼也能听出走到哪一步：
     吸气  上行滑音，像胸腔慢慢打开
     屏息  高而纯净的悬停音，几乎不衰减
     呼气  下行暖音，像叹出一口气
     空屏  很低、很轻的落地音
   每完成一次呼吸再加一点极轻的「开花」泛音，会话结束给一个收束和弦。
   ══════════════════════════════════════════════════════════ */
var audioCtx=null, ambient=null, chimeBus=null;
var chimeBuf={};              /* type -> AudioBuffer，首次用时渲染并缓存 */
var scheduled=[];             /* 已排程节点，暂停 / 停止时一次性撤回 */
var sched={epochCtx:0, horizon:0, active:false};
var soundOffTimer=0;          /* 关闭提示音后的延迟硬清理，重开时要撤销 */

function ensureCtx(){
  if(!audioCtx){
    try{
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      chimeBus=audioCtx.createGain();
      chimeBus.gain.value=1;
      chimeBus.connect(audioCtx.destination);
    }catch(e){ audioCtx=null; }
  }
  return audioCtx;
}

/* ── 音色合成：手碟 ────────────────────────────────────────
   不再用滑音 + 噪声去「模拟提示音」，而是按手碟的泛音列建模：
   基频 + 八度 + 十二度 + 两个高次泛音，各自指数衰减；再加槌头瞬态、
   低通和一小段房间混响。预渲染进 AudioBuffer，排程时每个阶段只占
   一个 BufferSource，息屏后不需要任何 JS 参与。 */

var HANDPAN={
  partials:[
    {r:1.000, a:1.000, t:3.20},        /* 基频 */
    {r:2.000, a:0.320, t:2.30},        /* 八度 */
    {r:2.710, a:0.200, t:1.60},        /* 十二度 */
    {r:4.050, a:0.070, t:0.95}         /* 一点金属亮度 */
  ],
  attack:0.008,
  transient:0.05,
  cutoff:4200
};

/* 往缓冲区里叠加一个手碟音。damp 缩放余音长度：
   吸气/呼气短一点，留出呼吸间隙；屏息/空屏可以长一点。 */
function addNote(d, sr, n, freq, vel, atSec, damp){
  var start=Math.floor((atSec||0)*sr);
  if(start>=n) return;
  var i, k, t;
  for(k=0;k<HANDPAN.partials.length;k++){
    var p=HANDPAN.partials[k];
    var f=freq*p.r;
    if(f>sr*0.45) continue;
    /* 旋转振荡器：每样本 4 次乘法，比 Math.sin / 查表都快，且不会漂幅 */
    var w=6.283185307179586*f/sr;
    var cw=Math.cos(w), sw=Math.sin(w);
    var xx=1, yy=0;
    var amp=p.a*vel, tau=p.t*damp;
    var life=Math.min(n-start, Math.floor(sr*tau*8));   /* 低于 -69dB 就停 */
    var attackN=Math.max(1, Math.floor(HANDPAN.attack*sr));
    var decay=Math.exp(-1/(sr*tau));
    var env=0;
    for(i=0;i<life;i++){
      if(i<attackN) env=i/attackN;      /* 线性起音，避免咔哒 */
      else env*=decay;                  /* 之后用乘法衰减，省掉逐样本 exp */
      d[start+i]+=amp*env*yy;
      var nx=xx*cw-yy*sw;
      yy=xx*sw+yy*cw;
      xx=nx;
    }
  }
  /* 槌头触弦的极短瞬态，给一点「实体感」 */
  var tn=Math.min(n-start, Math.floor(0.03*sr));
  for(i=0;i<tn;i++){
    t=i/sr;
    d[start+i]+=HANDPAN.transient*vel*(Math.random()*2-1)*Math.exp(-t/0.004);
  }
}
function lowpassBuf(d, sr, cutoff){
  var a=1-Math.exp(-6.283185307179586*cutoff/sr), lp=0;
  for(var i=0;i<d.length;i++){ lp+=a*(d[i]-lp); d[i]=lp; }
}
/* 小房间混响：4 梳状 + 2 全通。混响尾巴也烘进缓冲区，
   息屏排程时不需要任何 JS 参与。 */
function reverbBuf(d, sr, wet){
  var combD=[0.023,0.029,0.033,0.037], apD=[0.0040,0.0015];
  var combs=[], aps=[], i;
  for(i=0;i<combD.length;i++) combs.push({b:new Float32Array(Math.floor(combD[i]*sr)), i:0, lp:0});
  for(i=0;i<apD.length;i++) aps.push({b:new Float32Array(Math.floor(apD[i]*sr)), i:0});
  var fb=0.72, damp=0.30, g=0.68;
  for(var n=0;n<d.length;n++){
    var x=d[n], y=0;
    for(i=0;i<combs.length;i++){
      var co=combs[i], b=co.b[co.i];
      co.lp=b*(1-damp)+co.lp*damp;
      co.b[co.i]=x+co.lp*fb;
      co.i=(co.i+1)%co.b.length;
      y+=b;
    }
    y*=0.25;
    for(i=0;i<aps.length;i++){
      var ap=aps[i], b2=ap.b[ap.i];
      var v=-g*y+b2;
      ap.b[ap.i]=y+g*v;
      ap.i=(ap.i+1)%ap.b.length;
      y=v;
    }
    d[n]=x*(1-wet)+y*wet*1.7;
  }
}
/* 把一串手碟音渲染成一条完整的提示音 */
function renderCue(c, notes, dur, damp, peak){
  var sr=Math.min(c.sampleRate||44100, 20000);
  var n=Math.max(1, Math.floor(sr*dur));
  var buf=c.createBuffer(1, n, sr), d=buf.getChannelData(0);
  for(var i=0;i<notes.length;i++){
    addNote(d, sr, n, notes[i].f, notes[i].v, notes[i].at, damp);
  }
  lowpassBuf(d, sr, HANDPAN.cutoff);
  reverbBuf(d, sr, 0.28);
  /* 末尾 300ms 淡出，避免缓冲区截断爆音 */
  var fade=Math.min(n, Math.floor(sr*0.30));
  for(var i=0;i<fade;i++) d[n-1-i]*=i/fade;
  /* 按目标峰值归一化，响度只由 peak 决定 */
  var max=0;
  for(var i=0;i<n;i++){ var a=Math.abs(d[i]); if(a>max) max=a; }
  if(max>1e-6){ var k=peak/max; for(var i=0;i<n;i++) d[i]*=k; }
  return buf;
}

var HAND_NOTES={C3:130.81, G3:196.00, C4:261.63, E4:329.63, G4:392.00,
                C5:523.25, G5:783.99, C6:1046.50, D6:1174.66, G6:1567.98};

/* 每个阶段一声；dur 大致不超过最短的阶段长度（4 秒），
   吸气/呼气留出一点空隙，屏息/空屏可以长一点。 */
var CUE_DEFS={
  inhale:{dur:3.4, damp:0.70, peak:0.85, notes:[
    {f:HAND_NOTES.C4, v:0.72, at:0.00},
    {f:HAND_NOTES.G4, v:0.84, at:0.20},
    {f:HAND_NOTES.C5, v:1.00, at:0.40}]},
  hold:{dur:4.2, damp:0.95, peak:0.55, notes:[
    {f:HAND_NOTES.C5, v:0.66, at:0.00},
    {f:HAND_NOTES.G5, v:0.52, at:0.00}]},
  exhale:{dur:3.4, damp:0.70, peak:0.90, notes:[
    {f:HAND_NOTES.C5, v:1.00, at:0.00},
    {f:HAND_NOTES.G4, v:0.84, at:0.20},
    {f:HAND_NOTES.C4, v:0.72, at:0.40}]},
  settle:{dur:4.0, damp:0.85, peak:0.55, notes:[
    {f:HAND_NOTES.C3, v:0.58, at:0.00},
    {f:HAND_NOTES.G3, v:0.46, at:0.00}]},
  bloom:{dur:1.8, damp:0.35, peak:0.24, notes:[
    {f:HAND_NOTES.C6, v:0.34, at:0.00},
    {f:HAND_NOTES.D6, v:0.30, at:0.16},
    {f:HAND_NOTES.G6, v:0.26, at:0.32}]},
  done:{dur:4.6, damp:0.90, peak:0.62, notes:[
    {f:HAND_NOTES.C4, v:0.62, at:0.00},
    {f:HAND_NOTES.E4, v:0.56, at:0.18},
    {f:HAND_NOTES.G4, v:0.52, at:0.36},
    {f:HAND_NOTES.C5, v:0.58, at:0.54}]}
};
function buildChime(type){
  if(chimeBuf[type] || !audioCtx) return chimeBuf[type];
  var def=CUE_DEFS[type]; if(!def) return null;
  chimeBuf[type]=renderCue(audioCtx, def.notes, def.dur, def.damp, def.peak);
  return chimeBuf[type];
}
/* 打开提示音后在后台逐条预热，按「开始」时就不必现场合成 */
function warmCues(){
  var order=['inhale','hold','exhale','settle','bloom','done'], i=0;
  (function next(){
    if(i>=order.length) return;
    buildChime(order[i++]);
    setTimeout(next, 16);
  })();
}
var CHIME_MASTER=0.16;   /* 各条提示音已按 peak 归一到统一响度 */
function playChimeAt(c, type, when){
  var buf=buildChime(type); if(!buf) return;
  var src=c.createBufferSource(); src.buffer=buf;
  var g=c.createGain(); g.gain.value=CHIME_MASTER;
  src.connect(g); g.connect(chimeBus||c.destination);
  var entry={src:src, g:g, when:when};
  src.onended=function(){
    try{ src.disconnect(); g.disconnect(); }catch(e){}
    var k=scheduled.indexOf(entry); if(k>=0) scheduled.splice(k,1);
  };
  scheduled.push(entry);
  try{
    src.start(when);
  }catch(e){
    try{ src.disconnect(); g.disconnect(); }catch(_e){}
    var k=scheduled.indexOf(entry); if(k>=0) scheduled.splice(k,1);
  }
}
/* hard=true 时连正在响的也掐掉；默认只撤还没开始的，
   让暂停 / 停止时正在响的那一声自然收尾，不会出现咔哒声 */
function cancelScheduled(hard){
  var now=audioCtx?audioCtx.currentTime:0;
  for(var i=scheduled.length-1;i>=0;i--){
    var s=scheduled[i];
    if(hard || s.when > now+0.02){
      try{ s.src.stop(0); }catch(e){}
      try{ s.src.disconnect(); s.g.disconnect(); }catch(e){}
      scheduled.splice(i,1);
    }
  }
  sched.active=false;
}
function muteChimes(mute){
  if(!chimeBus || !audioCtx) return;
  try{
    var t=audioCtx.currentTime, v=chimeBus.gain.value;
    chimeBus.gain.cancelScheduledValues(t);
    chimeBus.gain.setValueAtTime(v, t);
    chimeBus.gain.linearRampToValueAtTime(mute?0.0001:1, t+0.08);
  }catch(e){}
}

/* ── 排程 ──────────────────────────────────────────────────
   把 [fromT, 会话结束] 之间所有阶段提示音挂到音频时钟上。
   固定时长会话一次排到底；「自由」模式排 60 分钟，够息屏用很久。 */
function scheduleSessionAudio(fromT){
  cancelScheduled();
  if(!S.running || S.paused || !S.soundOn) return;
  var c=ensureCtx(); if(!c) return;
  if(c.state==='suspended'){ try{ c.resume(); }catch(e){} }

  /* 先把音色都渲染好，避免播到一半才卡一下 */
  ['inhale','hold','exhale','settle','bloom','done'].forEach(buildChime);

  var info=cycleInfo();
  if(!(info.len>0)) return;
  /* 固定时长一次排到底；「自由」模式先排未来 60 分钟，快到期时再续 */
  var horizon = S.sessionTotal>0 ? S.sessionTotal : Math.max(3600, fromT+3600);
  /* 排程原点比 now 晚 50ms：给音频线程一点缓冲，也避免「立即」事件被吞 */
  sched.epochCtx = c.currentTime + 0.05;
  sched.horizon = horizon;
  sched.active = true;

  var lead = sched.epochCtx - fromT;   /* sessionT -> ctxTime 的固定偏移 */
  var count=0, MAX=1600;
  var t = Math.floor(fromT/info.len)*info.len;
  while(t < horizon && count < MAX){
    for(var i=0;i<info.starts.length && count<MAX;i++){
      var evT=t+info.starts[i].t;
      if(evT < fromT-0.002) continue;
      if(S.sessionTotal>0 && evT > S.sessionTotal-0.05) continue;  /* 终点交给收束音 */
      playChimeAt(c, info.starts[i].type, Math.max(c.currentTime, evT+lead));
      count++;
    }
    if(info.exEnd>0 && count<MAX){
      var bT=t+info.exEnd;                /* 呼气结束 = 种下一朵花的瞬间 */
      if(bT>=fromT-0.002 && bT<horizon &&
         !(S.sessionTotal>0 && bT>S.sessionTotal-0.05)){
        playChimeAt(c,'bloom', Math.max(c.currentTime, bT+lead));
        count++;
      }
    }
    t += info.len;
  }
  if(S.sessionTotal>0){
    playChimeAt(c,'done', Math.max(c.currentTime, S.sessionTotal+lead));
  }
}

/* 待机时切换节奏 / 打开提示音，给一声当前阶段的试听 */
function previewCue(){
  if(!S.soundOn) return;
  var c=ensureCtx(); if(!c) return;
  if(c.state==='suspended'){ try{ c.resume(); }catch(e){} }
  playChimeAt(c, curPhase().type, c.currentTime+0.02);
}

/* 原生壳里的 partial wake lock：息屏后不让 CPU 进深睡，
   已排程的音频才不会被系统掐断。网页 / PWA 没有这个对象，直接跳过。 */
function updateWakeLock(){
  var on = !!(S.running && !S.paused && (S.soundOn || S.ambientOn));
  try{
    var n=window.BreathingGardenNative;
    if(n){ if(on) n.startSession(); else n.stopSession(); }
  }catch(e){}
}
function startAmbient(){
  var c=ensureCtx(); if(!c||ambient) return;
  try{
    if(c.state==='suspended') c.resume();
    var len=Math.floor(c.sampleRate*4);
    var buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0), last=0;
    for(var i=0;i<len;i++){ var w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=clamp(last*3.2,-1,1); }
    var src=c.createBufferSource(); src.buffer=buf; src.loop=true;
    var lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=430; lp.Q.value=0.7;
    var g=c.createGain(); g.gain.value=0.0001;
    var lfo=c.createOscillator(); lfo.frequency.value=0.07;
    var lfoG=c.createGain(); lfoG.gain.value=170;
    lfo.connect(lfoG); lfoG.connect(lp.frequency);
    src.connect(lp); lp.connect(g); g.connect(c.destination);
    src.start(); lfo.start();
    g.gain.linearRampToValueAtTime(0.05, c.currentTime+1.6);
    ambient={src:src,lp:lp,g:g,lfo:lfo,base:0.05};
  }catch(e){ ambient=null; }
}
function stopAmbient(){
  if(!ambient) return;
  var c=audioCtx, a=ambient; ambient=null;
  if(!c) return;
  try{
    a.g.gain.cancelScheduledValues(c.currentTime);
    a.g.gain.linearRampToValueAtTime(0.0001, c.currentTime+0.9);
    setTimeout(function(){ try{ a.src.stop(); a.lfo.stop(); }catch(e){} },1000);
  }catch(e){}
}
function ambientBreathe(type){
  if(!ambient||!audioCtx) return;
  var mul = type==='inhale'?1.15 : (type==='exhale'?0.87 : 1.0);
  try{
    ambient.g.gain.cancelScheduledValues(audioCtx.currentTime);
    ambient.g.gain.linearRampToValueAtTime(ambient.base*mul, audioCtx.currentTime+1.2);
  }catch(e){}
}

/* ══════════════════════════════════════════════════════════
   12. 渲染主循环
   ══════════════════════════════════════════════════════════ */
var last=0, fpsAcc=0, fpsN=0, fpsLow=0, fpsHigh=0, fpsTimer=0;
function frame(now){
  requestAnimationFrame(frame);
  if(!last){ last=now; return; }
  var dt=(now-last)/1000; last=now;
  if(dt>0.1) dt=0.1;
  S.time += dt;

  var T=curTheme();

  /* 会话推进走真实时钟：息屏回来时 syncSession 会按真实经过时间追平 */
  if(S.running && !S.paused) syncSession();
  applyCentral(dt);
  updateFx(dt);
  updateSprouts(dt);
  syncTier(dt);
  if(S.gust>0.001) S.gust *= Math.exp(-dt*0.85);

  ctx.clearRect(0,0,W,H);
  ctx.drawImage(bg, 0,0, W,H);

  drawBlades(T,false);

  var dense = flowers.length>8;
  if(dense) for(var i=0;i<flowers.length;i++) if(flowers[i].back) drawFlower(flowers[i],T,false);
  for(var j=0;j<flowers.length;j++) if(!flowers[j].back) drawFlower(flowers[j],T,false);

  drawSprouts(T);
  drawBreathOrb(T);
  drawBlades(T,true);
  drawFx();
  drawMotes(dt,T);

  fpsAcc+=dt; fpsN++; fpsTimer+=dt;
  if(fpsTimer>=1){
    var f=fpsN/fpsAcc; fpsAcc=0; fpsN=0; fpsTimer=0;
    if(f<46){ if(++fpsLow>=2){ if(S.quality>0){ S.quality--; fpsLow=0; } } fpsHigh=0; }
    else if(f>57){ fpsLow=0; if(++fpsHigh>=8){ if(S.quality<3) S.quality++; fpsHigh=0; } }
    else { fpsLow=0; fpsHigh=0; }
  }
}
/* 圆润花瓣（比地上的花更饱满，因为它是「口」不是「瓣」） */
function orbPetal(len,wid){
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo( wid*1.18, -len*0.28,  wid*1.02, -len*0.76, 0, -len*0.94);
  ctx.bezierCurveTo(-wid*1.02, -len*0.76, -wid*1.18, -len*0.28, 0,  0);
  ctx.closePath();
}

function drawBreathOrb(T){
  var g = orbGeom();
  var pc = central.color || FLOWER_PALETTE[0];
  var lit = T.light;
  var cHi = shade(pc.hi, lit), cMid = shade(pc.mid, lit), cDeep = shade(pc.deep, lit);

  /* 外光晕：呼吸时向外扩 */
  var gr = g.petal * 2.7 * (0.55 + 0.65*g.glow);
  var hg = ctx.createRadialGradient(g.x, g.y, g.core*0.6, g.x, g.y, gr);
  hg.addColorStop(0,    rgba(cMid, 0.26*g.glow));
  hg.addColorStop(0.45, rgba(cDeep, 0.11*g.glow));
  hg.addColorStop(1,    rgba(cDeep, 0));
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(g.x, g.y, gr, 0, 6.283); ctx.fill();

  /* 花瓣环：极缓慢旋转，随呼吸开合 */
  var n = 10;
  var spin = S.time * 0.055 * central.spin;
  for(var i=0;i<n;i++){
    var ang = i/n*6.283 + spin;
    var tone = 1 + 0.11*Math.cos(ang - Math.PI*1.25);   /* 左上受光 */
    ctx.save();
    ctx.translate(g.x, g.y); ctx.rotate(ang);
    ctx.fillStyle = rgba(shade(cMid, tone*lit), 0.88);
    orbPetal(g.petal, g.petal*0.40);
    ctx.fill();
    ctx.lineWidth = Math.max(0.5, g.r*0.008);
    ctx.strokeStyle = rgba(cDeep, 0.14);
    ctx.stroke();
    ctx.restore();
  }

  /* 内核：亮度随呼吸上升 */
  var cg = ctx.createRadialGradient(g.x - g.core*0.3, g.y - g.core*0.3, 0,
                                    g.x, g.y, g.core);
  cg.addColorStop(0,    rgba(cHi, 0.99));
  cg.addColorStop(0.55, rgba(cMid, 0.94));
  cg.addColorStop(1,    rgba(cDeep, 0.80));
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(g.x, g.y, g.core, 0, 6.283); ctx.fill();

  /* 倒计时：白色，画在圆心。
     不能用 textBaseline='middle' —— 那是按 em 盒中线对齐，而数字的「墨迹」并不在
     em 盒正中，看起来会偏上。这里量出墨迹包围盒，把墨迹中心对到圆心。 */
  var fs = Math.max(18, g.core*0.62);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '300 ' + fs.toFixed(1) + 'px -apple-system,BlinkMacSystemFont,"Segoe UI",' +
             '"PingFang SC","Microsoft YaHei",sans-serif';
  var m = ctx.measureText(S.countText);
  var asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent;
  var lft = m.actualBoundingBoxLeft,   rgt = m.actualBoundingBoxRight;
  var dx = (asc != null && lft != null) ? (lft - rgt)/2 : 0;
  var dy = (asc != null && desc != null) ? (asc - desc)/2 : fs*0.35;
  ctx.fillStyle = 'rgba(255,255,255,.96)';
  ctx.shadowColor = 'rgba(60,30,50,.32)';
  ctx.shadowBlur = fs*0.26;
  ctx.fillText(S.countText, g.x + dx, g.y + dy);
  ctx.restore();
}
/* 草：填充叶形，远淡近浓，随风摇摆 */
function drawBlades(T, front){
  var cap = S.quality>=3 ? blades.length : Math.round(blades.length*(0.42+S.quality*0.18));
  var lit = T.light;
  for(var i=0;i<cap;i++){
    var b=blades[i];
    if(!!b.front !== !!front) continue;
    var bx = b.nx*W;
    var by = bandTop + bandH*(0.05 + b.ny*0.98);
    var bh = bandH*b.h;
    var bw = W*b.w*0.5;
    var sw = Math.sin(S.time*0.75 + b.phase)*0.30 + b.lean*0.5;
    var tipX = bx + sw*bh*0.85, tipY = by - bh;
    var base = mix(T.bladeFar, T.blade, b.depth);
    ctx.beginPath();
    ctx.moveTo(bx-bw, by);
    ctx.bezierCurveTo(bx-bw*0.6+sw*bh*0.2, by-bh*0.5,
                      tipX-bw*0.25,          tipY+bh*0.25,
                      tipX, tipY);
    ctx.bezierCurveTo(tipX+bw*0.25,          tipY+bh*0.25,
                      bx+bw*0.6+sw*bh*0.2, by-bh*0.5,
                      bx+bw, by);
    ctx.closePath();
    /* 低位透明度：草是「纹理」而非主角，否则会像贴上去的贴纸 */
    var a = front ? 0.82 : (0.16 + b.depth*0.30);
    ctx.fillStyle = rgba(shade(base, lit), a);
    ctx.fill();
  }
}

function makeChips(container, items, activeKey, onPick){

makeChips(patWrap,
  PATTERN_ORDER.map(function(k){return {key:k,label:PATTERNS[k].name};}),

         这一轮结束后再换，并把选中态拨回当前节奏。 */
      var chips=patWrap.querySelectorAll('.chip');

(function buildSwatches(){
  THEME_LIST.forEach(function(t){
    var b=document.createElement('button');
    b.className='sw'+(t===S.theme?' on':'');
    b.dataset.theme=t;
    b.innerHTML='<i></i><span>'+THEME_NAMES[t]+'</span>';
    b.onclick=function(){
      document.body.className='theme-'+t;
      S.theme=t;

      b.classList.add('on');
      /* 每张天光图地平线不同，换主题要重算基线 */
      bandTop = H*(HORIZON[t] || 0.65);
      bandH = H - bandTop;
      for(var i=0;i<flowers.length;i++) flowers[i].baseY = flowerBaseY(flowers[i].nBase);
      buildBackground();
      /* 手机状态栏跟着主题走。纯装饰，任何异常都不该影响换主题本身 */
      try{
        var thm = document.querySelector('meta[name="theme-color"]');
        if(thm) thm.setAttribute('content', getComputedStyle(document.body).backgroundColor);
      }catch(e){}
    };
    swatches.appendChild(b);
  });
})();
function setSoundUI(){ soundBtn.classList.toggle('on', S.soundOn); }
soundBtn.onclick=function(){
  S.soundOn=!S.soundOn; setSoundUI();
  if(S.soundOn){
    if(soundOffTimer){ clearTimeout(soundOffTimer); soundOffTimer=0; }
    var c=ensureCtx(); if(c&&c.state==='suspended') c.resume();
    muteChimes(false);
    if(S.running && !S.paused) scheduleSessionAudio(S.sessionElapsed);
    else if(!S.running) previewCue();
    setTimeout(warmCues, 30);      /* 其余音色后台预热 */
  }else{
    muteChimes(true);
    if(soundOffTimer) clearTimeout(soundOffTimer);
    soundOffTimer=setTimeout(function(){
      soundOffTimer=0;
      cancelScheduled(true);        /* 先淡出再撤，避免咔哒声 */
    },120);
  }
  updateWakeLock();
};
function setAmbientUI(){ ambientBtn.classList.toggle('on', S.ambientOn); }
ambientBtn.onclick=function(){
  S.ambientOn=!S.ambientOn; setAmbientUI();
  if(S.ambientOn) startAmbient(); else stopAmbient();
  updateWakeLock();
};
ctlToggle.onclick=function(){ ctlPanel.classList.toggle('open'); };

function setPhaseUI(animate){
  var p=curPhase();
  phaseEl.textContent=p.label;
  S.countText=String(p.sec);
  if(animate){
    phaseEl.classList.add('fade');
    setTimeout(function(){ phaseEl.classList.remove('fade'); },160);
  }
  /* 提示音不在这里发：它在音频时间轴上已经提前排好，
     息屏时也会照常响。 */
  ambientBreathe(p.type);
}
function idleReset(){
  S.idx=0; S.phaseElapsed=0;
  S.sessionElapsed=0; S.sessionTotal=S.durVal;
  phaseEl.textContent='准备';
  S.countText=String(curPhase().sec);
  hintEl.textContent='找一个舒服的姿势，放松肩膀，准备好后点击「开始」';
  progressBar.style.width='0';
  central.bloom=0.85; central.tilt=0.05;
  showTime();
}
function start(){
  if(S.soundOn||S.ambientOn){ var c=ensureCtx(); if(c&&c.state==='suspended') c.resume(); }
  S.running=true; S.paused=false;
  S.sessionElapsed=0; S.sessionTotal=S.durVal; S.breathCount=0;
  S.idx=0; S.phaseElapsed=0;
  S.clockBase=performance.now();
  progressBar.style.width='0';
  showTime();
  hintEl.textContent='跟着花的呼吸，走神了就温柔地回到呼吸上';
  setPhaseUI(true);
  scheduleSessionAudio(0);      /* 把整段会话的提示音一次排到音频时钟上 */
  updateWakeLock();
  btn.textContent='暂 停'; btn.classList.remove('paused');
  stopBtn.classList.add('show');
  ctlPanel.classList.remove('open');
  summaryEl.classList.remove('show');
}
function pauseToggle(){
  if(!S.running) return;
  syncSession();                /* 先对齐到这一刻，暂停时间才准 */
  if(!S.running) return;        /* 正好在点击前一瞬间自然结束 */
  S.paused=!S.paused;
  btn.textContent = S.paused?'继 续':'暂 停';
  btn.classList.toggle('paused', S.paused);
  if(S.paused){
    cancelScheduled();          /* 撤掉还没响的提示音；正在响的尾音让它自然收尾 */
    phaseEl.textContent='已暂停';
    if(ambient&&audioCtx){ try{ ambient.g.gain.linearRampToValueAtTime(0.0001,audioCtx.currentTime+.6); }catch(e){} }
  }else{
    S.clockBase=performance.now()-S.sessionElapsed*1000;
    phaseEl.textContent=curPhase().label;
    ambientBreathe(curPhase().type);
    scheduleSessionAudio(S.sessionElapsed);   /* 从当前阶段重新排程 */
  }
  updateWakeLock();
}
function finish(natural){
  S.running=false; S.paused=false;
  /* 自然结束：终点上的收束音早已排在音频时钟上（息屏也照响），这里不再补；
     用户手动结束：撤掉所有还没响的提示音。 */
  if(!natural) cancelScheduled();
  updateWakeLock();
  btn.textContent='开 始'; btn.classList.remove('paused');
  stopBtn.classList.remove('show');
  ctlPanel.classList.add('open');
  if(natural){
    S.gust=1;
    emitPollenRain();
    sumBreaths.textContent=S.breathCount;
    sumTime.textContent=fmt(S.sessionTotal||S.sessionElapsed);
    summaryEl.classList.add('show');
    setTimeout(function(){ summaryEl.classList.remove('show'); },2000);
    phaseEl.textContent='完成';
    S.countText='✓';
    hintEl.textContent='做得很好。花留在原地，随时可以再开始一轮。';
    progressBar.style.width='100%';
    timeEl.textContent='00:00';
  }else{
    idleReset();
  }
}
btn.onclick=function(){ if(!S.running) start(); else pauseToggle(); };
stopBtn.onclick=function(){ finish(false); };

/* ══════════════════════════════════════════════════════════
   14. resize / 初始化
   ══════════════════════════════════════════════════════════ */
var rt=null;
function onResize(){
  clearTimeout(rt);
  rt=setTimeout(function(){
    layout(); buildAssets(); buildMotes();
    /* 屏幕变窄时上限会收紧（手机塞不下 80 朵），已有花也要跟着裁掉，
       否则旋转到竖屏后会挤成一团 */
    while(flowers.length > MAX_FLOWERS) flowers.shift();
    assignLayers();
    for(var i=0;i<flowers.length;i++){
      flowers[i].x = flowerX(flowers[i].nx);
      flowers[i].baseY = flowerBaseY(flowers[i].nBase);
      flowers[i].size = flowerSize(flowers[i]);
    }
  },140);
}
/* 息屏 / 切后台：音频时间轴上已排好的提示音不受影响。
   回到前台时按真实经过时间把画面、倒计时和花一次追平。 */
var hiddenCtxState='running';
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='hidden'){
    hiddenCtxState = audioCtx ? audioCtx.state : 'none';
    return;
  }
  var ctxOk = (hiddenCtxState==='running');
  var ctxRunning = !audioCtx || audioCtx.state==='running';
  if(audioCtx && audioCtx.state==='suspended'){ try{ audioCtx.resume(); }catch(e){} }
  if(S.running && !S.paused){
    syncSession();
    /* 后台期间音频上下文若被挂起，或自由模式排程到期，就重新锚定排程 */
    if(S.running && S.soundOn &&
       (!sched.active || !ctxOk || !ctxRunning || S.sessionElapsed > sched.horizon-5)){
      scheduleSessionAudio(S.sessionElapsed);
    }
  }
});

window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);

layout(); buildAssets(); buildMotes();
idleReset();
loadAssets();          /* 异步加载生图素材，到位后自动替换背景/花 */
requestAnimationFrame(frame);

/* 注册 Service Worker 以获得可安装/离线能力。三种情况不注册：
   file:// 打开（浏览器不允许）、跑在 Capacitor 原生壳里（资源已打包，SW 反而导致更新不生效） */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.Capacitor){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

})();
</script>
